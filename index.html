<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Design and deploy live architecture on a canvas. Place load balancers, app servers, databases, caches, and queues, then spin up a live stack with metrics for each node."
    />
    <link rel="canonical" href="https://www.runcloud9.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="runcloud9" />
    <meta property="og:title" content="runcloud9 | Design and deploy live architecture" />
    <meta
      property="og:description"
      content="Design and deploy live architecture on a canvas. Place load balancers, app servers, databases, caches, and queues, then spin up a live stack with metrics for each node."
    />
    <meta property="og:url" content="https://www.runcloud9.io/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="runcloud9 | Design and deploy live architecture" />
    <meta
      name="twitter:description"
      content="Design and deploy live architecture on a canvas. Place load balancers, app servers, databases, caches, and queues, then spin up a live stack with metrics for each node."
    />
    <script>
      // Hide crawlable #root shell on app routes before first paint (SPA rewrite
      // serves index.html for /dashboard etc.; avoid unstyled hero flash).
      (function () {
        var path = location.pathname.replace(/\/+$/, '') || '/'
        var marketing =
          path === '/' ||
          path === '/about' ||
          path === '/privacy' ||
          path === '/terms' ||
          path === '/pricing'
        if (!marketing) document.documentElement.classList.add('rc9-hide-seo')
      })()
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #08070c;
        color: #bdb8c9;
      }
      html.rc9-hide-seo #root > [data-seo-shell] {
        position: absolute !important;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      #root > [data-seo-shell] {
        box-sizing: border-box;
        max-width: 40rem;
        margin: 0 auto;
        padding: 5rem 1.5rem 2rem;
        font-family: Inter, system-ui, sans-serif;
        font-size: 1rem;
        line-height: 1.6;
      }
      #root > [data-seo-shell] h1 {
        margin: 0 0 1rem;
        color: #f2f0f7;
        font-family: 'IBM Plex Serif', Georgia, serif;
        font-size: clamp(1.75rem, 4vw, 2.25rem);
        font-weight: 500;
        line-height: 1.2;
      }
      #root > [data-seo-shell] p {
        margin: 0 0 1rem;
      }
      #root > [data-seo-shell] a {
        color: #59497a;
      }
      #root > [data-seo-shell] nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        margin-top: 1.5rem;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Serif:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>runcloud9 | Design and deploy live architecture</title>
  </head>
  <body>
    <div id="root">
      <main data-seo-shell>
        <h1>Design and deploy live architecture on a canvas.</h1>
        <p>
          Place load balancers, app servers, databases, caches, and queues on the canvas. One
          deploy spins up a live stack. Metrics display for each node while traffic runs for 9
          minutes.
        </p>
        <p><a href="/canvas">Start building</a></p>
        <nav aria-label="Site">
          <a href="/about">About</a>
          <a href="/privacy">Privacy</a>
          <a href="/terms">Terms</a>
          <a href="/login">Sign in</a>
        </nav>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
